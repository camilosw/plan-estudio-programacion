<!--
  TEMA 14: Formularios
  Explicación completa: tema14_formularios.md
-->
<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tema 14: Formularios | La Cafetería de Sandra</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Lato:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="estilos_tema14.css" />
  </head>
  <body>
    <header>
      <div class="logo">La Cafetería de Sandra</div>
    </header>

    <main>
      <h1>Contacto</h1>
      <p class="subtitulo">
        Escríbenos para reservas, catering o cualquier consulta.
      </p>

      <form action="#" method="post" class="formulario-contacto">
        <!-- Campo de texto: nombre completo (obligatorio) -->
        <div class="campo-formulario">
          <label for="nombre">Nombre completo *</label>
          <input
            type="text"
            id="nombre"
            name="nombre"
            placeholder="Sandra García"
            required
          />
        </div>

        <!-- Campo de email: el navegador valida el formato -->
        <div class="campo-formulario">
          <label for="email">Correo electrónico *</label>
          <input
            type="email"
            id="email"
            name="email"
            placeholder="sandra@ejemplo.com"
            required
          />
        </div>

        <!-- Campo de teléfono: opcional -->
        <div class="campo-formulario">
          <label for="telefono">Teléfono (opcional)</label>
          <input
            type="tel"
            id="telefono"
            name="telefono"
            placeholder="+54 11 1234-5678"
          />
        </div>

        <!-- Lista desplegable: tipo de consulta -->
        <div class="campo-formulario">
          <label for="consulta">Tipo de consulta</label>
          <select id="consulta" name="consulta">
            <option value="">Selecciona una opción</option>
            <option value="reserva">Reserva de mesa</option>
            <option value="catering">Catering para evento</option>
            <option value="pedido">Pedido especial</option>
            <option value="otro">Otro</option>
          </select>
        </div>

        <!-- Área de texto: mensaje libre -->
        <div class="campo-formulario">
          <label for="mensaje">Mensaje</label>
          <textarea
            id="mensaje"
            name="mensaje"
            rows="5"
            placeholder="Escribe tu mensaje aquí..."
          ></textarea>
        </div>

        <!-- Checkbox: aceptar términos -->
        <div class="campo-checkbox">
          <input type="checkbox" id="terminos" name="terminos" required />
          <label for="terminos"
            >Acepto recibir comunicaciones de La Cafetería de Sandra</label
          >
        </div>

        <button type="submit" class="boton-enviar">Enviar mensaje</button>
      </form>
    </main>
  </body>
</html>

<!--
============================================================
TEMA 4: Imágenes
============================================================

OBJETIVO:
Aprender a insertar imágenes en una página web y entender
los atributos esenciales: src, alt, width y height.

EXPLICACIÓN:
Insertar una imagen es como pegar una foto en un álbum:
hay que saber dónde está la foto (src) y escribir una descripción
al pie para quien no puede verla (alt).

Atributos de <img>:
- src: ruta o URL de la imagen (obligatorio).
  Puede ser una ruta local (imagen.jpg) o una URL completa.
- alt: texto alternativo que describe la imagen (obligatorio).
  Lo usan los lectores de pantalla para personas con discapacidad
  visual, y los buscadores para entender el contenido. Si la imagen
  no carga, el navegador muestra este texto.
- width y height: dimensiones en píxeles.
  Conviene definirlos para que la página no "salte" mientras carga.

Nota importante:
<img> es una etiqueta "vacía" o "auto-cerrante": no envuelve
contenido, solo referencia un archivo externo, por eso no tiene
etiqueta de cierre </img>.

SINTAXIS:
<img src="ruta/imagen.jpg" alt="Descripción de la imagen" width="300" height="200">

En este tema se usan imágenes de placeholder (marcador de posición).
El servicio https://placehold.co/ genera imágenes de ejemplo con el
tamaño y texto que se indique en la URL, sin necesitar archivos locales.

============================================================
-->
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Tema 4: Imágenes | La Cafetería de Sandra</title>
</head>
<body>

    <h1>La Cafetería de Sandra</h1>

    <!-- Imagen de encabezado: ancho completo, representa el local -->
    <img src="https://placehold.co/800x300?text=La+Cafeteria+de+Sandra"
         alt="Vista exterior de La Cafetería de Sandra"
         width="800"
         height="300">

    <h2>Nuestros productos destacados</h2>

    <!-- Imagen de producto: tamaño mediano con descripción útil -->
    <img src="https://placehold.co/300x200?text=Cappuccino"
         alt="Cappuccino con espuma cremosa en taza blanca"
         width="300"
         height="200">

    <img src="https://placehold.co/300x200?text=Latte"
         alt="Café latte con arte en la espuma"
         width="300"
         height="200">

    <img src="https://placehold.co/300x200?text=Croissant"
         alt="Croissant recién horneado con mantequilla"
         width="300"
         height="200">

    <h2>Nuestro local</h2>

    <p>Un espacio cálido y acogedor para disfrutar el mejor café.</p>

    <!-- Imagen sin dimensiones definidas: el navegador espera a que cargue -->
    <img src="https://placehold.co/600x400?text=Interior+de+la+cafeteria"
         alt="Interior de La Cafetería con mesas de madera y luz cálida"
         width="600"
         height="400">

</body>
</html>

<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Tema 10: Modelo de caja | La Cafetería de Sandra</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Lato:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="estilos_tema10.css" />
  </head>
  <body>
    <h1>La Cafetería de Sandra</h1>
    <p class="subtitulo">Nuestros productos</p>

    <!-- Tarjetas de producto: cada una es una caja con padding, border y margin -->
    <div class="contenedor-tarjetas">
      <div class="tarjeta-producto">
        <img
          src="https://placehold.co/220x140?text=Cappuccino"
          alt="Cappuccino"
          width="220"
          height="140"
        />
        <h3>Cappuccino</h3>
        <p class="descripcion">
          Espresso con leche vaporizada y espuma cremosa.
        </p>
        <p class="precio">$4.00</p>
      </div>

      <div class="tarjeta-producto">
        <img
          src="https://placehold.co/220x140?text=Cafe+Latte"
          alt="Café latte"
          width="220"
          height="140"
        />
        <h3>Café Latte</h3>
        <p class="descripcion">
          Espresso suave con abundante leche vaporizada.
        </p>
        <p class="precio">$4.50</p>
      </div>

      <div class="tarjeta-producto">
        <img
          src="https://placehold.co/220x140?text=Cold+Brew"
          alt="Cold brew"
          width="220"
          height="140"
        />
        <h3>Cold Brew</h3>
        <p class="descripcion">
          Café extraído en frío durante 12 horas. Suave y refrescante.
        </p>
        <p class="precio">$5.00</p>
      </div>
    </div>
  </body>
</html>

<!--
============================================================
TEMA 10: Display y posición
============================================================

OBJETIVO:
Entender la diferencia entre elementos en bloque y en línea,
y cómo cambiar su comportamiento con display.
Introducir position: relative y absolute.

EXPLICACIÓN:

DISPLAY:
- block: el elemento ocupa toda la fila. El siguiente elemento
  empieza debajo. Ejemplos: <div>, <p>, <h1>, <ul>, <li>.
- inline: el elemento solo ocupa el espacio de su contenido.
  Los elementos se colocan uno al lado del otro como palabras.
  No acepta width ni height. Ejemplos: <span>, <a>, <strong>.
- inline-block: se comporta como inline (se coloca al lado de otros)
  pero acepta width, height, padding y margin como block.
  Útil para botones o elementos en fila.
- none: oculta el elemento completamente. No ocupa espacio en la
  página, como si no existiera.

POSITION:
Por defecto todos los elementos tienen position: static, que significa
que siguen el flujo normal del documento.

- relative: el elemento permanece en el flujo normal, pero puedes
  moverlo usando top, right, bottom, left respecto a donde estaría
  normalmente. Además, se convierte en el "punto de referencia"
  para los hijos con position: absolute.

- absolute: el elemento sale del flujo normal y se posiciona
  respecto al ancestro más cercano con position: relative (o al
  <body> si no hay ninguno). Usar para badges, tooltips, etc.

============================================================
-->
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Tema 10: Display y posición | La Cafetería de Sandra</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Lato:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="estilos_tema10.css">
</head>
<body>

    <!-- MENÚ DE NAVEGACIÓN HORIZONTAL con display: inline-block -->
    <nav>
        <!-- Los <li> son block por defecto. Con inline-block quedan en fila. -->
        <ul>
            <li><a href="#">Inicio</a></li>
            <li><a href="#">Menú</a></li>
            <li><a href="#">Nosotros</a></li>
            <li><a href="#">Contacto</a></li>
        </ul>
    </nav>

    <h1>La Cafetería de Sandra</h1>

    <!-- TARJETA CON BADGE: posición relativa + absoluta -->
    <div class="contenedor-tarjetas">

        <!-- Tarjeta normal -->
        <div class="tarjeta-producto">
            <img src="https://placehold.co/220x140?text=Cappuccino"
                 alt="Cappuccino" width="220" height="140">
            <h3>Cappuccino</h3>
            <p class="precio">$4.00</p>
        </div>

        <!-- Tarjeta con badge "Nuevo": el badge está posicionado de forma absoluta -->
        <div class="tarjeta-producto">
            <!-- position: relative en .tarjeta-producto hace que el badge
                 se posicione respecto a esta tarjeta, no respecto a la página -->
            <span class="badge-nuevo">Nuevo</span>
            <img src="https://placehold.co/220x140?text=Cafe+de+Temporada"
                 alt="Café de temporada" width="220" height="140">
            <h3>Café de Temporada</h3>
            <p class="precio">$5.50</p>
        </div>

        <!-- Tarjeta normal -->
        <div class="tarjeta-producto">
            <img src="https://placehold.co/220x140?text=Cold+Brew"
                 alt="Cold Brew" width="220" height="140">
            <h3>Cold Brew</h3>
            <p class="precio">$5.00</p>
        </div>

    </div>

    <!-- display: none — este párrafo existe en el HTML pero no se muestra -->
    <p class="aviso-cerrado">Hoy estamos cerrados por feriado.</p>

    <!-- Nota: para ver el efecto de display:none, abrir las DevTools,
         buscar el elemento .aviso-cerrado y cambiar display a block -->

</body>
</html>

<!--
============================================================
EJERCICIO 10: Display y posición
============================================================

Crear ejercicio10_display_y_posicion.html con su archivo
estilos_ejercicio10.css en la carpeta ejercicios/.

En el HTML:
1. Un <nav> con una <ul> de 4 ítems de navegación
2. Tres tarjetas de producto, donde al menos una tenga un
   <span class="badge"> con el texto "Nuevo" o "Oferta"
3. Un párrafo oculto con class="oculto"

En el CSS:
1. nav ul { list-style: none; padding: 0; }
   nav ul li { display: inline-block; margin-right: 16px; }
   → Esto convierte la lista vertical en un menú horizontal

2. .tarjeta-producto {
       position: relative; → referencia para el badge absoluto
       display: inline-block;
       vertical-align: top;
       ... (padding, border, etc. del tema anterior)
   }

3. .badge {
       position: absolute;
       top: 8px; right: 8px;
       background-color: ...;
       color: white;
       padding: 4px 8px;
       border-radius: 4px;
       font-size: 0.75rem;
   }

4. .oculto { display: none; }

Verificación:
- El menú de navegación debe mostrarse en una sola fila horizontal
- El badge debe aparecer en la esquina superior de la tarjeta
- El párrafo con class="oculto" no debe verse en la página
- En las DevTools, cambiar display:none a display:block en .oculto
  para verificar que el párrafo sí existe en el HTML

============================================================
-->

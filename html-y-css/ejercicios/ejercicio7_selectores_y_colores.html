<!--
============================================================
EJERCICIO 7: Selectores y colores con archivo CSS externo
============================================================

Objetivo:
Usar selectores de etiqueta, clase e ID, y definir colores
en los tres formatos disponibles en CSS.

Este archivo se vincula con estilos_ejercicio7.css.
Asegúrate de crear ese archivo en la misma carpeta (ejercicios/).

Instrucciones para el HTML:
1. Agrega el <link> al archivo CSS externo en el <head>
2. En el body incluye:
   a) Un <h1> con id="titulo-principal" y el nombre de la cafetería
   b) Una <section class="seccion-menu"> con:
      - Un <h2> "Nuestro menú"
      - Un párrafo descriptivo
      - Un párrafo con class="destacado"
   c) Una <section class="seccion-contacto"> con:
      - Un <h2> "Contacto"
      - Un párrafo con la dirección
      - Un párrafo con class="destacado"

Instrucciones para estilos_ejercicio7.css:
1. Selector de etiqueta: body (background-color, font-family)
2. Selector de etiqueta: p (color, font-size: 16px)
3. Selector de ID: #titulo-principal (color, font-size)
4. Selector de clase: .destacado (color, font-weight: bold, font-size: 18px)
5. Selector de clase: .seccion-menu (background-color, padding: 16px)
6. Selector de clase: .seccion-contacto (background-color diferente, padding: 16px)

Colores a usar (uno de cada formato):
- Al menos un color por NOMBRE: brown, darkgreen, navy, etc.
- Al menos un color en HEXADECIMAL: #5c3317, #2e7d32, etc.
- Al menos un color en RGB: rgb(92, 51, 23), rgb(46, 125, 50), etc.

Verificación:
- Las dos secciones deben tener fondos de colores diferentes
- Los párrafos con class="destacado" deben verse en negrita y
  con un color diferente al del resto del texto
- El h1 con el ID debe tener su propio estilo distinto
- En las DevTools (F12), verificar que los estilos vienen
  del archivo estilos_ejercicio7.css y no de estilos inline

============================================================
-->

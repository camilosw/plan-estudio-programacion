<!--
============================================================
EJERCICIO 10: Tarjetas de producto con el modelo de caja
============================================================

Objetivo:
Aplicar margin, padding, border y border-radius para crear
tarjetas de producto con espaciado correcto.

Este archivo se vincula con estilos_ejercicio10.css.

Instrucciones para el HTML:
1. Un <h1> con el nombre de la cafetería
2. Un <div class="contenedor-tarjetas"> que contenga exactamente
   3 <div class="tarjeta-producto">, cada uno con:
   a) Una imagen: <img src="https://placehold.co/220x140?text=Producto" alt="...">
   b) Un <h3> con el nombre del producto
   c) Un <p class="descripcion"> con una descripción breve
   d) Un <p class="precio"> con el precio

Instrucciones para estilos_ejercicio10.css:
1. Aplica box-sizing: border-box a todos los elementos:
   * { box-sizing: border-box; }

2. Estilos para .tarjeta-producto:
   - width: 260px
   - padding: 16px
   - border: 1px solid (elige el color)
   - border-radius: 8px
   - margin: 16px
   - background-color: #ffffff
   - display: inline-block
   - vertical-align: top

3. Estilos para las imágenes dentro de las tarjetas:
   .tarjeta-producto img {
       width: 100%;
       height: auto;
       display: block;
       margin-bottom: 12px;
   }

4. Estilos para h3, .descripcion y .precio a tu gusto

Actividad con las DevTools:
- Abrir el archivo en el navegador
- Presionar F12 para abrir las DevTools
- Hacer clic en el ícono de inspector (cursor con cuadro)
- Seleccionar una tarjeta haciendo clic sobre ella
- En el panel de la derecha, ir a la pestaña "Computed"
- Buscar el diagrama del box model y verificar los valores

Verificación:
- Las 3 tarjetas deben aparecer en fila
- Cada tarjeta debe tener el borde y las esquinas redondeadas
- El padding debe crear espacio entre el contenido y el borde
- El margin debe crear espacio entre tarjetas
- En las DevTools, el box model debe mostrar los valores correctos

============================================================
-->

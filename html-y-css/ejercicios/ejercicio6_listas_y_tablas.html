EJERCICIO 6: Listas y tabla de precios
============================================================

Objetivo:
Organizar información del menú de la cafetería usando listas
desordenadas con sublistas y una tabla de precios.

Instrucciones:
1. Un <h1> con el nombre de la cafetería
2. Un <h2> con el texto "Los más vendidos"
   Debajo: una lista ORDENADA (<ol>) con 3 cafés populares

3. Un <h2> con el texto "Carta completa"
   Debajo: una lista DESORDENADA (<ul>) con al menos 3 categorías:
   - Bebidas calientes (con al menos 3 sublistas: espresso, cappuccino, latte)
   - Bebidas frías (con al menos 2 sublistas)
   - Pastelería (con al menos 2 sublistas)

   Debajo: una tabla (<table> con border="1") que incluya:
   - <thead> con una fila de encabezados: Producto, Tamaño, Precio
   - <tbody> con al menos 5 productos (uno por fila)

   <tr>
       <td>Cappuccino</td>
       <td>Mediano (250ml)</td>
       <td>$4.00</td>
   </tr>

Verificación:
- La lista ordenada debe mostrar números (1, 2, 3)
- La lista desordenada debe mostrar viñetas
- Las sublistas deben verse indentadas
- Los encabezados de la tabla (<th>) deben verse en negrita
- La tabla debe tener bordes visibles (gracias al border="1")

============================================================

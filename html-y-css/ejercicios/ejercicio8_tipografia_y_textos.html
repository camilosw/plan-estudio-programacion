<!--
============================================================
EJERCICIO 8: Tipografía con Google Fonts
============================================================

Objetivo:
Aplicar dos fuentes de Google Fonts y controlar la tipografía
de la página usando rem, text-align y line-height.

Este archivo se vincula con estilos_ejercicio8.css.

Instrucciones para el HTML:
1. Elegir dos fuentes en fonts.google.com:
   - Una para títulos (algo elegante o con personalidad)
   - Una para el cuerpo del texto (clara y legible)
2. Copiar el <link> de Google Fonts al <head>
3. En el body incluir:
   a) Un <h1> con el nombre de la cafetería
   b) Un <p class="subtitulo"> con un texto breve descriptivo
   c) Dos <h2> con secciones (por ejemplo: "Historia" y "Nuestro menú")
   d) Un párrafo largo bajo cada h2
   e) Al menos 3 párrafos con class="precio" (nombre — $precio)
   f) Un <p class="nota"> al final con horarios o información útil

Instrucciones para estilos_ejercicio8.css:
1. html { font-size: 16px; }
2. body:
   - font-family: la fuente de texto de Google
   - font-size: 1rem
   - line-height: 1.6
3. h1, h2:
   - font-family: la fuente de títulos de Google
   - text-align: center
4. p:
   - font-size: 1rem
   - text-align: justify
5. .subtitulo:
   - font-size: 1.125rem
   - font-style: italic
   - text-align: center
6. .precio:
   - font-size: 1.25rem  (25% más grande que la base)
   - font-weight: 700
   - text-align: center
7. .nota:
   - font-size: 0.875rem  (más pequeño que la base)
   - font-style: italic

Verificación:
- Los títulos deben usar la fuente de Google elegida para títulos
- El texto de los párrafos debe usar la otra fuente
- Los párrafos largos deben estar justificados
- Los .precio deben verse más grandes y en negrita
- Las .nota deben verse más pequeñas y en cursiva

============================================================
-->
